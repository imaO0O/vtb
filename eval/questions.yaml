    group: счёт
    type: account
    client: anya
    question: Всё ли у меня в порядке с налогами?
    must_include: ["бывшего работодателя", "без чека"]
  - id: A10
    group: счёт
    type: account
    client: max
    question: Какой у меня остаток бонуса?
    must_include: ["израсходован"]
  - id: A11
    group: счёт
    type: account
    client: anya

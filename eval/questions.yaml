  # ---------- счёт клиента (демо-клиенты) ----------
  - id: A01
    group: счёт
    type: account
    client: anya
    question: Сколько мне осталось до лимита?
    must_include: ["2 368 000"]
  - id: A02
    group: счёт
    type: account
    client: max
    question: Сколько мне осталось до лимита?
    must_include: ["150 000", "20 календарных дней"]
  - id: A03
    group: счёт
    type: account
    client: anya
    question: По каким поступлениям у меня нет чека?
    must_include: ["4 500", "ирина", "20 %|20%"]
  - id: A04
    group: счёт
    type: account
    client: max
    question: Есть у меня переводы без чека?
    must_include: ["15 000"]
  - id: A05
    group: счёт
    type: account
    client: anya
    question: Что с переводом от моего бывшего работодателя?

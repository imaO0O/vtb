# Случаи, которые в одной части закона описаны рядом и которые небольшая модель путает.
# Если вопрос о случае question, а в ответе правило другого случая (wrong без right), модель один раз
# получает подсказку hint и переписывает ответ; не исправила — ответ не показывается.
# Подсказка не содержит ответа — только какой это случай в терминах закона.
cases:
  - name: срок чека при оплате картой
    question: "карт|перевод|сбп|онлайн|электронн|qr|(?<!без)наличн"
    unless: "ины\\w* форм|реквизит|платёжн\\w* поручен|платежн\\w* поручен|расч[её]тн\\w* сч[её]т"
    wrong: "9-го|9 числа|девятого"
    right: "момент"
    hint: >-
      Во фрагменте разные сроки для разных способов оплаты. Оплата картой, переводом на карту, через СБП или
      онлайн-банк — это расчёт с использованием электронных средств платежа, а не «иные формы безналичных расчётов».
      Перепиши ответ по правилу именно для этого случая, со ссылкой [n].
  - name: ставка при оплате от организации
    question: "организац|ооо|юрлиц|юридическ|\\bип\\b|индивидуальн"
    wrong: "\\b4\\s*%|4 процент"
    right: "\\b6\\s*%|6 процент"
    hint: >-
      Во фрагменте разные ставки для разных покупателей. В вопросе оплату делает организация или индивидуальный
      предприниматель. Перепиши ответ по ставке именно для этого случая, со ссылкой [n].

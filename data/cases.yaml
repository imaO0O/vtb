# Случаи, которые в одной части закона описаны рядом и которые небольшая модель путает.
# Если вопрос о случае question, а в ответе правило другого случая (wrong без right), модель один раз
# получает подсказку hint и переписывает ответ; не исправила — ответ не показывается.
# Подсказка не содержит ответа — только какой это случай в терминах закона.
# note — то же пояснение заранее, в первом запросе: если во фрагментах есть правила обоих случаев
# (или то, что задано в context).
cases:
  - name: срок чека при оплате картой
    question: "карт|перевод|сбп|онлайн|электронн|qr|(?<!без)наличн"
    unless: "ины\\w* форм|реквизит|платёжн\\w* поручен|платежн\\w* поручен|расч[её]тн\\w* сч[её]т"
    wrong: "9-го|9 числа|девятого"
    right: "момент"
    note: >-
      оплата картой, переводом на карту, через СБП или онлайн-банк — это расчёт с использованием электронных
      средств платежа, а не «иные формы безналичных расчётов».
    hint: >-
      Во фрагменте разные сроки для разных способов оплаты. Оплата картой, переводом на карту, через СБП или
      онлайн-банк — это расчёт с использованием электронных средств платежа, а не «иные формы безналичных расчётов».
      Перепиши ответ по правилу именно для этого случая, со ссылкой [n].
  - name: ставка при оплате от организации
    question: "организац|ооо|юрлиц|юридическ|\\bип\\b|индивидуальн"
    wrong: "\\b4\\s*%|4 процент"
    right: "\\b6\\s*%|6 процент"
    note: >-
      в вопросе оплату делает организация или индивидуальный предприниматель — для этого случая в законе своя ставка.
    hint: >-
      Во фрагменте разные ставки для разных покупателей. В вопросе оплату делает организация или индивидуальный
      предприниматель. Перепиши ответ по ставке именно для этого случая, со ссылкой [n].
  - name: будущее режима
    # в законе только срок эксперимента: «не отменят» или «продлят» — прогноз, которого в законе нет;
    # ответ без оговорки «что будет после, закон не говорит» переписывается
    question: '(?:отмен|продл)\w*[^?]{0,40}(?:самозанят|режим|нпд|эксперимент|налог\w* на проф)|(?:самозанят|режим|нпд|эксперимент)[^?]{0,40}(?:отмен|продл)|после 2028|после двадцать восьмого'
    unless: "чек|регистрац|уч[её]т"
    context: "2028"
    wrong: '2028|не отмен\w*|отмен\w* не\b|продлят|будет продл'
    right: "не (?:говорит|говорится|сказано|указан|определ|установлен)|неизвестн|не известн|не решен|не решён"
    note: >-
      в законе указан только срок эксперимента. Не обещай, что режим отменят или не отменят, продлят или не продлят:
      скажи, до какого срока он установлен законом, и что о том, что будет после, закон не говорит.
    hint: >-
      В законе указан только срок эксперимента, прогноза в нём нет. Перепиши ответ: до какого срока режим установлен
      законом и что о том, что будет после этого срока, закон не говорит, со ссылкой [n].

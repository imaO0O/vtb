# Демо-клиенты банка для показа помощника. Люди и организации вымышлены.
# Даты операций задаются относительно сегодняшнего дня, чтобы демо выглядело одинаково в любой день показа:
#   m — сколько месяцев назад (0 — текущий месяц), d — число месяца (в текущем месяце — не позже сегодняшнего);
#   kind: work — оплата за работу (профессиональный доход), salary — зарплата, personal — перевод от близких;
#   payer_kind: person — физическое лицо (ставка 4 %), company — организация или ИП (6 %);
#   channel: card — перевод на карту (СБП, по номеру карты), account — платёж по реквизитам счёта;
#   receipt — сформирован ли чек в «Мой налог».
# year_work_total — сколько всего заработано с начала года: операции прошлых месяцев года достраиваются,
# чтобы сумма не зависела от дня показа (для клиента у лимита дохода).

clients:

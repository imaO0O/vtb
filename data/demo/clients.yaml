    name: Аня
    age: 19
    about: "Студентка, рисует иллюстрации и портреты на заказ. Самозанятая третий месяц."
    npd_since_months: 2            # встала на учёт как самозанятая — 2 месяца назад
    deduction_used: 0              # бонус 10 000 ₽ ещё не использован
